# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/roomy_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:roomy_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:roomy_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Server Configuration
server.port=8080

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.roomy=DEBUG
logging.level.org.springframework.jdbc=DEBUG